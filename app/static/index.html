<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI客服小D</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    #log { border: 1px solid #ddd; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #e8f0fe; text-align: right; }
    .bot { background: #f1f3f4; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    #send { padding: 10px 20px; border: none; border-radius: 8px; background: #4B3FE3; color: #fff; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>AI客服小D</h2>
  <div id="log"></div>
  <div class="row">
    <input id="input" placeholder="请输入您的售后问题…" />
    <button id="send">发送</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    // 对话历史：前端自己记住，每次随请求发给后端（大模型本身没有记忆）
    const history = [];

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function sendMsg() {
      const message = input.value.trim();
      if (!message) return;
      addMsg(message, "user");
      input.value = "";
      send.disabled = true;
      const botDiv = addMsg("", "bot");

      let full = "";
      try {
        const resp = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          const msg = (err.error && err.error.message) || err.detail || resp.status;
          botDiv.textContent = "出错了：" + msg;
          send.disabled = false;
          return;
        }

        // 解析 SSE：后端每吐一段就追加显示
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop();
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data: ")) continue;
            const data = line.slice(6);
            if (data === "[DONE]") continue;
            const delta = JSON.parse(data).delta || "";
            full += delta;
            botDiv.textContent = full;
            log.scrollTop = log.scrollHeight;
          }
        }
      } catch (e) {
        botDiv.textContent = "网络错误：" + e.message;
      } finally {
        if (full) {
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: full });
        }
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener("click", sendMsg);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
  </script>
</body>
</html>
