name: Nightly Eval

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00，每天跑一次效果评估
    - cron: "0 18 * * *"
  workflow_dispatch:        # 支持手动触发

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（评估层不需要浏览器）
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest requests

      - name: 跑效果评估（12 条评测集 + LLM 裁判）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          pytest -m eval -s | tee eval-report.txt

      - name: 上传评估报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.txt
          if-no-files-found: warn
